<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Profile | WE ARE.</title>
  <meta name="description" content="Edit Profile - WE ARE.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page-edit-profile">

  <header class="site-header app-header">
    <div class="logo-container">
      <a href="index.html">WE ARE.</a>
    </div>
    <nav class="main-navigation app-navigation">
      <ul class="nav-list">
        <li><a href="feed.html">Feed</a></li>
        <li><a href="discover.html">Discover</a></li>
        <li><a href="connection.html">Connections</a></li>
        <li><a href="message.html">Messages</a></li>
        <li><a href="notification.html">Notifications</a></li>
        <li><a href="create-post.html">Create Post</a></li>
        <li><a href="profile.html" class="active">Profile</a></li>
        <li><a href="settings.html">Settings</a></li>
      </ul>
    </nav>
    <div class="header-actions">
      <a href="notification.html" class="notifications-link">Notifications</a>
      <a href="profile.html" class="profile-link">My Profile</a>
      <a href="settings.html" class="settings-link">Settings</a>
    </div>
  </header>

  <main class="page-content">
    <section class="page-header content-section">
      <h1 class="page-title">Edit Profile</h1>
    </section>

    <section class="edit-profile-form-section content-section">
      <form class="edit-profile-form" id="edit-profile-form">
        <div class="form-field">
          <label for="edit-photo">Profile Photo</label>
          <div class="profile-photo-placeholder" aria-label="Profile photo placeholder"></div>
          <input type="file" id="edit-photo" name="photo">
        </div>
        <div class="form-field">
          <label for="edit-username">Username</label>
          <input type="text" id="edit-username" name="username">
        </div>
        <div class="form-field">
          <label for="edit-bio">Bio</label>
          <textarea id="edit-bio" name="bio" rows="4"></textarea>
        </div>
        <div class="form-field">
          <label for="edit-interests">Interests</label>
          <input type="text" id="edit-interests" name="interests">
        </div>
        <div class="form-field">
          <label for="edit-personality">Personality</label>
          <textarea id="edit-personality" name="personality" rows="4"></textarea>
        </div>
        <button type="submit" class="cta-button cta-primary">Save Changes</button>
        <a href="profile.html" class="cta-button cta-secondary">Cancel</a>
      </form>
    </section>
  </main>

  <footer class="site-footer app-footer">
    <p class="footer-tagline">WE ARE. &mdash; You were never the only one.</p>
    <nav class="footer-navigation">
      <ul class="footer-links">
        <li><a href="privacy.html">Privacy</a></li>
        <li><a href="terms.html">Terms</a></li>
        <li><a href="guidelines.html">Guidelines</a></li>
        <li><a href="report.html">Report a Problem</a></li>
      </ul>
    </nav>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
